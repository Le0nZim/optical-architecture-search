name: Tests
on: [push, pull_request]
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt streamlit
      - run: python -m pytest -q
        env:
          JAX_PLATFORMS: cpu
          MPLBACKEND: Agg
